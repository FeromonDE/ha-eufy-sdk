# One-time publisher: only the intended 0.7.0 manifest bump on main creates a release.
# Remove after HACS can see the v0.7.0 tag.
name: Publish Eufy Integration v0.7.0

on:
  push:
    branches: [main]
    paths:
      - custom_components/eufy_sdk/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify requested integration version
        id: version
        run: |
          VERSION="$(python3 -c "import json; print(json.load(open('custom_components/eufy_sdk/manifest.json'))['version'])")"
          if [ "$VERSION" = "0.7.0" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not publishing version $VERSION from this one-time workflow"
          fi

      - name: Create HACS-compatible GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.7.0 >/dev/null 2>&1 || gh release create v0.7.0 \
            --target "$GITHUB_SHA" \
            --title "v0.7.0" \
            --notes "Eufy Security SDK Home Assistant integration 0.7.0 fork. Requires the updated FeromonDE Bridge 0.7.2 for reliable attached-camera availability. Retains Custom 1/2/3 labels, targeted realtime HomeBase arming updates, and configurable RTSP host port."
